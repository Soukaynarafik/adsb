[package]
name = "adsb-ghost-injector"
version = "0.2.0"
edition = "2021"
authors = ["Soukaynarafik", "Vanessalauransot", "Cyber Security Researcher"]
description = "Advanced real-time ADS-B attack simulation and injection platform"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }